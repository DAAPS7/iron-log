name = "iron-log"
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"

# Depois de criares o namespace do KV (ver README), substitui "id" abaixo
# pelo ID real que o comando `wrangler kv namespace create` te devolver.
# Isto é usado sobretudo para desenvolvimento local (`wrangler pages dev`).
# Em produção, a ligação faz-se no painel do Cloudflare (Pages → o teu
# projeto → Settings → Functions → KV namespace bindings).
[[kv_namespaces]]
binding = "USERS_KV"
id = "0a86e3d7e1224a0e83c281e167282914"
