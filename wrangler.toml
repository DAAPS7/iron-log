name = "iron-log"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Depois de criares o namespace do KV (ver README), substitui "id" abaixo
# pelo ID real que o comando `wrangler kv namespace create` te devolver.
[[kv_namespaces]]
binding = "USERS_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
